<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adovasio Time</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/time.css?v=3">
  <!--#include virtual="/_adovasio-shared/footer/head.html" -->
</head>
<body>

  <main class="time-stage">
    <div class="container">
      <p class="server-badge">Stratum 2 NTP server</p>

      <div class="clock" id="clock">
        --:--:--.<span class="ms">---</span>
      </div>

      <div class="controls">
        <label for="tz">Time zone:</label>
        <select id="tz"></select>
      </div>

      <div class="info">
        Authoritative time provided by <strong>time.adovasio.com</strong><br>
        Backend time is UTC (NTP-disciplined)<br>
        Hosted by <a href="https://adovasio.com">Adovasio Technology LLC</a>
      </div>
    </div>

    <a class="scroll-cue" href="#more-info">
      Scroll for more sites &amp; info
      <span aria-hidden="true">↓</span>
    </a>
  </main>

  <div id="more-info" tabindex="-1"></div>
  <!--#include virtual="/_adovasio-shared/footer/footer.html" -->
  <script src="/time.js" defer></script>
</body>
</html>
